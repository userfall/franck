<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="Accès sécurisé au tableau de bord Franckefootball." />
    <title>Administration - Franckefootball</title>
    <link rel="icon" href="logo.jpeg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <main class="auth-main">
      <section class="panel glass auth-card">
        <p class="section-kicker">Administration sécurisée</p>
        <h1>Connexion au tableau de bord</h1>
        <p>Connecte-toi avec un compte administrateur enregistré dans Firebase.</p>
        <form id="authForm" class="auth-form">
          <label>
            <span>E-mail</span>
            <input name="email" type="email" required autocomplete="email" />
          </label>
          <label>
            <span>Mot de passe</span>
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <p id="authMessage" class="auth-message" aria-live="polite"></p>
          <button class="primary-btn" type="submit">Se connecter</button>
        </form>
        <a class="secondary-btn auth-back-link" href="index.html">Retour au site</a>
      </section>
    </main>
    <script type="module" src="auth.js"></script>
  </body>
</html>
